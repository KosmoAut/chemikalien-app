name: App bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK bauen
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Packliste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Packliste
          path: Packliste.apk
      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Packliste ${{ github.run_number }}
          files: Packliste.apk
          make_latest: true

  uitest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Packliste
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: App im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash ci/uitest.sh
      - name: Ergebnisse veröffentlichen
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uitest-${{ github.run_number }}
          name: UI-Test ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: shots/*
